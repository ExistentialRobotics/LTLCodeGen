/**:
  teleop_twist_joy:
    ros__parameters:
      # PS4 Controller Configuration for Husky/Jackal Robot
      
      # Left stick vertical (axis 1) - forward/backward movement
      axis_linear:
        x: 1
      scale_linear:
        x: 0.5
      scale_linear_turbo:
        x: 1.0
      
      # Right stick horizontal (axis 2) - rotation
      axis_angular:
        yaw: 0
      scale_angular:
        yaw: 0.5
      scale_angular_turbo:
        yaw: 1.0
      
      # R1 button (button 5) - enable button (must hold to move)
      enable_button: 9
      enable_turbo_button: 10  # R2 button (button 7) - turbo mode
      
      require_enable_button: true
    
    # PS4 Button Reference:
    # Button 0: X (Cross)
    # Button 1: O (Circle)
    # Button 2: Triangle
    # Button 3: Square
    # Button 4: L1
    # Button 5: R1
    # Button 6: L2
    # Button 7: R2
    # Button 8: Share
    # Button 9: Options
    # Button 10: PS Button
    # Button 11: L3 (Left stick press)
    # Button 12: R3 (Right stick press)
    #
    # Axis 0: Left stick horizontal
    # Axis 1: Left stick vertical
    # Axis 2: Right stick horizontal
    # Axis 3: Right stick vertical (unused)
    # Axis 4: L2 analog (unused)
    # Axis 5: R2 analog (unused)
