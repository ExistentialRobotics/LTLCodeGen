/**:
  semantic_sensor_node:
    ros__parameters:
      # Camera intrinsic matrix parameters
      camera:
        fx: 320
        fy: 320
        cx: 320
        cy: 240

        width: 640
        height: 480

      semantic_pcl:
        color_image_topic: "/husky_1/camera/color/image_raw"
        semantic_image_topic: "/husky_1/camera/semantic/class_map"
        depth_image_topic: "/husky_1/camera/depth/image_raw"
        point_type: 0
        unit_conversion: 1.0
        frame_id: "husky_1/base_link"
        depth_noise_std: 0.0
        true_class_prob: 1.0
        is_semantic_img_classes: true
